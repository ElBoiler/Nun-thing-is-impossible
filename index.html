<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Streaks — Habit Tracker</title>
<meta name="description" content="A tiny offline habit tracker. Five habits, one tap a day, honest streaks.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Streaks">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --card-2:#fafbfc;
  --text:#11151c; --muted:#6b7280; --faint:#9aa1ab;
  --line:#e6e8ec; --line-strong:#d6d9df;
  --miss:#e5484d; --untracked:#e3e5e9;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 4px 12px rgba(16,24,40,.04);
  --tap:#00000010;
  /* density knobs — everything that decides how tall the page wants to be
     scales with viewport height, so the content fills a big phone without
     ever overflowing a small one */
  --cell:clamp(8px, 1.45vh, 15px);
  --dot:clamp(15px, 2.7vh, 30px);
  --mark:clamp(44px, 7vh, 62px);
  --pad:clamp(5px, .9vh, 10px);
  --gap:clamp(5px, 1vh, 10px);
}
:root[data-theme="dark"]{
  --bg:#0e1116; --card:#171b22; --card-2:#1d222b;
  --text:#e9edf3; --muted:#98a1ae; --faint:#6b7482;
  --line:#242a33; --line-strong:#323a45;
  --miss:#ff6369; --untracked:#262c35;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.28);
  --tap:#ffffff14;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --card:#171b22; --card-2:#1d222b;
    --text:#e9edf3; --muted:#98a1ae; --faint:#6b7482;
    --line:#242a33; --line-strong:#323a45;
    --miss:#ff6369; --untracked:#262c35;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.28);
    --tap:#ffffff14;
  }
}
*{box-sizing:border-box}
html{height:100%}

/* The app is a fixed three-row shell: header, one scroll region, tab bar.
   Nothing outside `main` can ever move, so there is no page scroll, no
   rubber-banding and no address-bar reflow on iOS. */
body{
  position:fixed; inset:0; margin:0; padding:0;
  display:flex; flex-direction:column;
  overflow:hidden; overscroll-behavior:none;
  background:var(--bg); color:var(--text);
  font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:0 14px}

/* ---------- header ---------- */
header{
  flex:none;
  padding-top:env(safe-area-inset-top);
  border-bottom:1px solid var(--line);
}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 9px}
.htitle h1{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.htitle p{font-size:12px;color:var(--muted);margin-top:1px;line-height:1.25}
.icon-btn{
  width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;
  background:var(--card);border:1px solid var(--line);color:var(--muted);
}
.icon-btn:active{background:var(--card-2)}
.icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- the one scroll region ---------- */
main.wrap{
  flex:1; min-height:0;
  overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
  padding:var(--gap) 14px;
  align-self:center;
}
.view{min-height:100%;display:flex;flex-direction:column}
.view[hidden]{display:none}
.stack{flex:1;display:flex;flex-direction:column;gap:var(--gap)}
#v-today .stack,#v-insights .stack{justify-content:center}

/* Fewer habits, bigger everything — the column fills the viewport either way. */
.stack[data-n="1"]{--dot:clamp(30px,7vh,56px);--mark:clamp(66px,12vh,100px)}
.stack[data-n="2"]{--dot:clamp(26px,5.4vh,46px);--mark:clamp(58px,9.5vh,84px)}
.stack[data-n="3"]{--dot:clamp(22px,4.2vh,38px);--mark:clamp(52px,8vh,72px)}
#v-insights .stack[data-n="1"] .isect{max-height:min(40vh,300px);--cell:clamp(16px,3.4vh,30px)}
#v-insights .stack[data-n="2"] .isect{max-height:min(30vh,230px);--cell:clamp(13px,2.7vh,24px)}
#v-insights .stack[data-n="3"] .isect{max-height:min(24vh,190px);--cell:clamp(11px,2.2vh,19px)}

/* ---------- today ---------- */
.banner{
  flex:none;background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:calc(var(--pad) + 2px) 12px;box-shadow:var(--shadow);
}
.banner b{display:block;font-size:13.5px;font-weight:650;letter-spacing:-.01em}
.banner span{font-size:12px;color:var(--muted);display:block;line-height:1.35}
.banner.tip{display:flex;gap:10px;align-items:flex-start}
.banner.tip .x{margin-left:auto;color:var(--faint);font-size:19px;line-height:1;padding:0 2px}

.card{
  flex:0 1 auto; min-height:70px; overflow:hidden;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:var(--pad) 11px;
  display:flex;gap:11px;align-items:center;
}
.card .body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:5px}
.card .top{display:flex;align-items:center;gap:7px;min-width:0}
.card .emoji{font-size:16px;line-height:1;flex:none}
.card h2{flex:1;min-width:0;font-size:15px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .flame{flex:none;font-size:12.5px;font-weight:650;color:var(--c)}
.card .broken{flex:none;font-size:11.5px;color:var(--faint)}

.mark{
  flex:none;width:var(--mark);height:var(--mark);border-radius:50%;
  display:grid;place-items:center;
  border:2px solid var(--c);background:var(--c);color:#fff;
  transition:transform .12s ease, background .15s ease, border-color .15s ease;
}
.mark svg{width:44%;height:44%;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.mark:active{transform:scale(.9)}
.mark[data-state="missed"]{background:transparent;border-color:var(--miss);color:var(--miss);border-style:dashed}

.week{display:flex;flex-direction:column;gap:3px}
.wk-head,.wk-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk-head i{font-style:normal;font-size:9.5px;line-height:1.2;color:var(--faint);text-align:center}
.wk-head i.now{color:var(--text);font-weight:700}
.day{
  width:100%;max-width:var(--dot);aspect-ratio:1;border-radius:6px;
  justify-self:center;background:var(--untracked);
}
.day[data-s="kept"]{background:var(--c)}
.day[data-s="miss"]{background:transparent;border:1.5px dashed var(--miss)}
.day[data-s="none"]{opacity:.5}
.day[data-today="1"]{outline:2px solid var(--line-strong);outline-offset:2px}

/* ---------- empty state ---------- */
.empty{
  flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:20px 16px;
}
.empty .big{font-size:30px}
.empty b{display:block;margin:8px 0 3px;font-size:16px}
.empty p{font-size:13px;color:var(--muted);max-width:32ch;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:14px}
.chip{border:1px solid var(--line);background:var(--card-2);border-radius:99px;padding:7px 12px;font-size:13.5px;font-weight:550}
.chip:active{background:var(--tap)}

/* ---------- insights ---------- */
.summary{
  flex:none;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--card);border:1px solid var(--line);border-radius:13px;
  box-shadow:var(--shadow);padding:calc(var(--pad) + 1px) 4px;
}
.summary div{text-align:center;padding:0 2px;border-left:1px solid var(--line)}
.summary div:first-child{border-left:0}
.summary b{display:block;font-size:19px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.summary span{display:block;font-size:9.5px;color:var(--muted);line-height:1.25;margin-top:1px}

.isect{
  flex:1 1 auto;min-height:60px;overflow:hidden;
  background:var(--card);border:1px solid var(--line);border-radius:13px;
  box-shadow:var(--shadow);padding:var(--pad) 11px;
  display:flex;gap:11px;align-items:center;
}
.isect .ileft{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.isect .itop{display:flex;align-items:center;gap:6px;min-width:0}
.isect .itop h3{flex:1;min-width:0;font-size:14.5px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.isect .emoji{font-size:15px;line-height:1;flex:none}
.inums{display:flex;gap:8px;flex-wrap:nowrap;overflow:hidden}
.inums span{font-size:10px;color:var(--muted);white-space:nowrap}
.inums b{font-size:13.5px;font-weight:700;letter-spacing:-.02em;color:var(--text);margin-right:2px}
.inums span:first-child b{color:var(--c)}

.ical{flex:none;display:grid;grid-template-columns:repeat(7,var(--cell));gap:2px}
.ical button{width:var(--cell);height:var(--cell);border-radius:2.5px;background:var(--untracked)}
.ical button[data-s="kept"]{background:var(--c)}
.ical button[data-s="miss"]{background:transparent;border:1px dashed var(--miss)}
.ical button[data-s="none"]{opacity:.4}
.ical button[data-today="1"]{outline:1.5px solid var(--line-strong);outline-offset:1px}

.legend{flex:none;display:flex;gap:11px;flex-wrap:wrap;justify-content:center;font-size:10.5px;color:var(--faint);padding-top:1px}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:9px;height:9px;border-radius:3px;display:block}

/* ---------- habits (manage) ---------- */
.row{
  flex:none;background:var(--card);border:1px solid var(--line);border-radius:13px;
  box-shadow:var(--shadow);padding:calc(var(--pad) + 1px) 10px;
}
.row .line{display:flex;align-items:center;gap:9px}
.emo{
  width:36px;height:36px;flex:none;border-radius:10px;background:var(--card-2);
  font-size:17px;display:grid;place-items:center;
  box-shadow:inset 0 0 0 2px var(--c);
}
.row input[type=text]{
  flex:1;min-width:0;background:transparent;border:0;border-bottom:1px dashed var(--line-strong);
  padding:5px 2px;font-size:15px;font-weight:550;
}
.row input[type=text]:focus{outline:none;border-bottom-style:solid;border-bottom-color:var(--text)}
.del{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;color:var(--faint)}
.del:active{background:var(--tap);color:var(--miss)}
.del svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.panel{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.emopick{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.emopick button{aspect-ratio:1;border-radius:8px;background:var(--card-2);border:1px solid var(--line);font-size:16px}
.emopick button[aria-pressed="true"]{border-color:var(--text)}
.swatches{display:flex;gap:8px;margin-top:8px;align-items:center}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;position:relative}
.sw i{position:absolute;inset:2px;border-radius:50%;display:block}
.sw[aria-pressed="true"]{border-color:var(--text)}
.panel .meta{font-size:11px;color:var(--faint);margin-left:auto;text-align:right;line-height:1.3}

.addbox{flex:none;background:var(--card);border:1px dashed var(--line-strong);border-radius:13px;padding:8px 10px}
.addbox .line{display:flex;gap:8px;align-items:center}
.addbox input{flex:1;min-width:0;background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:15px}
.addbox input:focus{outline:none;border-color:var(--line-strong)}
.btn{border-radius:10px;padding:9px 14px;font-size:14.5px;font-weight:600;background:var(--text);color:var(--bg)}
.btn:active{opacity:.8}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.ghost:active{background:var(--card-2)}
.btnrow{display:flex;gap:7px}
.btnrow .btn{flex:1;text-align:center;padding:9px 6px;font-size:13.5px}
.hint{flex:none;font-size:11.5px;color:var(--faint);text-align:center;line-height:1.35}
.sect{flex:none;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:calc(var(--pad) + 2px) 10px;box-shadow:var(--shadow)}
.sect h3{font-size:13.5px;font-weight:650;margin-bottom:7px}
.sect .note{font-size:11.5px;color:var(--muted);line-height:1.35;margin-top:7px}

/* ---------- tab bar ---------- */
nav{
  flex:none;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav button{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:7px 0 6px;color:var(--faint);font-size:10.5px;font-weight:600;
}
nav button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--text)}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;transform:translate(-50%,16px);
  bottom:calc(66px + env(safe-area-inset-bottom));z-index:50;
  background:var(--text);color:var(--bg);
  padding:8px 14px;border-radius:99px;font-size:13px;font-weight:550;
  opacity:0;pointer-events:none;transition:opacity .18s ease, transform .18s ease;
  max-width:calc(100vw - 40px);text-align:center;
}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* Landscape phones and other very short viewports: strip Today back to the
   habit and its button so the list still fits without scrolling. History stays
   available on the Insights tab. */
@media (max-height: 520px){
  .hrow{padding:5px 0}
  .htitle h1{font-size:18px}
  .htitle p{display:none}
  #v-today .banner,#v-today .week{display:none}
  .card{min-height:44px;--mark:clamp(38px,10vh,48px)}
  .card .body{gap:0}
  .isect{min-height:46px}
  nav button{padding:5px 0 4px}
  nav button svg{width:18px;height:18px}
}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<header id="hdr">
  <div class="wrap hrow">
    <div class="htitle">
      <h1 id="vTitle">Today</h1>
      <p id="vSub"></p>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Switch theme">
      <svg id="themeIcon" viewBox="0 0 24 24"></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <section id="v-today" class="view"></section>
  <section id="v-insights" class="view" hidden></section>
  <section id="v-habits" class="view" hidden></section>
</main>

<nav>
  <div class="inner" role="tablist">
    <button role="tab" data-view="today" aria-selected="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.4 12.4l2.5 2.5 4.7-5.2"/></svg>
      <span>Today</span>
    </button>
    <button role="tab" data-view="insights" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M5 20V12M12 20V4M19 20v-6"/></svg>
      <span>Insights</span>
    </button>
    <button role="tab" data-view="habits" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M4 7h9M17.5 7H20M4 17h3M11.5 17H20"/><circle cx="15.5" cy="7" r="2.2"/><circle cx="9.5" cy="17" r="2.2"/></svg>
      <span>Habits</span>
    </button>
  </div>
</nav>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ------------------------------------------------------------------ *
 * Constants
 * ------------------------------------------------------------------ */
var KEY   = 'nti-habits-v1';
var TIPKEY= 'nti-habits-tip';
var THKEY = 'nti-habits-theme';
var MAX   = 5;
var DAY   = 86400000;

var PALETTE = ['#16a34a','#0ea5e9','#f59e0b','#ec4899','#8b5cf6'];
var EMOJI   = ['✅','💧','🏃','📚','🧘','🥗','💤','🦷','🎸','✍️','🚶','💪','☎️','🌱','🧹','🎯'];
var SUGGEST = [
  {icon:'💧', name:'Drink water'},
  {icon:'🏃', name:'Move 30 min'},
  {icon:'📚', name:'Read'},
  {icon:'🧘', name:'Meditate'},
  {icon:'💤', name:'Bed by 11'}
];

/* ------------------------------------------------------------------ *
 * Dates — everything is local-time "YYYY-MM-DD", never UTC
 * ------------------------------------------------------------------ */
function iso(d){
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}
function parseISO(s){
  var p = s.split('-');
  return new Date(+p[0], +p[1]-1, +p[2]);
}
function todayISO(){ return iso(new Date()); }
function addDays(s, n){
  var d = parseISO(s); d.setDate(d.getDate()+n); return iso(d);
}
function diffDays(a, b){ /* whole days from a to b, DST-safe */
  return Math.round((parseISO(b) - parseISO(a)) / DAY);
}
function isISO(s){ return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
function fmt(s, opts){ return parseISO(s).toLocaleDateString(undefined, opts); }
function plural(n, word){ return n + ' ' + word + (n === 1 ? '' : 's'); }

/* ------------------------------------------------------------------ *
 * Storage
 * ------------------------------------------------------------------ */
function uid(){ return Math.random().toString(36).slice(2, 9); }

function normalise(h, i){
  return {
    id:     typeof h.id === 'string' ? h.id : uid(),
    name:   String(h.name == null ? 'Habit' : h.name).slice(0, 40) || 'Habit',
    icon:   typeof h.icon === 'string' ? h.icon : EMOJI[0],
    color:  /^#[0-9a-f]{6}$/i.test(h.color) ? h.color : PALETTE[i % PALETTE.length],
    start:  isISO(h.start) ? h.start : todayISO(),
    misses: Array.isArray(h.misses) ? h.misses.filter(isISO).filter(uniq) : []
  };
}
function uniq(v, i, a){ return a.indexOf(v) === i; }

function load(){
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return { v:1, habits:[] };
    var d = JSON.parse(raw);
    if (!d || !Array.isArray(d.habits)) return { v:1, habits:[] };
    return { v:1, habits: d.habits.slice(0, MAX).map(normalise) };
  } catch (e) {
    return { v:1, habits:[] };
  }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { toast('Could not save — storage is full or blocked'); }
}

var state = load();

/* ------------------------------------------------------------------ *
 * Stats
 * ------------------------------------------------------------------ */
function missedOn(h, d){ return h.misses.indexOf(d) >= 0; }

/* A day is one of: 'kept' (assumed done), 'miss' (tapped off), 'none' (before
   the habit existed, or in the future). */
function dayState(h, d){
  var t = todayISO();
  if (d < h.start || d > t) return 'none';
  return missedOn(h, d) ? 'miss' : 'kept';
}

function stats(h){
  var today = todayISO();
  var start = h.start > today ? today : h.start;
  var cur = 0, best = 0, run = 0, kept = 0, total = 0;
  var recentWin = 30, recentKept = 0, recentTotal = 0;
  var recentFrom = addDays(today, -(recentWin - 1));

  for (var d = start; ; d = addDays(d, 1)) {
    total++;
    var ok = !missedOn(h, d);
    if (ok) { run++; kept++; if (run > best) best = run; } else { run = 0; }
    if (d >= recentFrom) { recentTotal++; if (ok) recentKept++; }
    if (d === today) { cur = ok ? run : 0; break; }
    if (total > 20000) break; /* paranoia guard */
  }
  return {
    cur: cur, best: best, kept: kept, total: total,
    misses: total - kept,
    rate: total ? kept / total : 1,
    recentRate: recentTotal ? recentKept / recentTotal : 1,
    recentTotal: recentTotal, recentMisses: recentTotal - recentKept
  };
}

/* Consecutive days, ending today, on which every habit alive that day was kept. */
function perfectStreak(){
  if (!state.habits.length) return 0;
  var n = 0;
  for (var d = todayISO(); n < 3700; d = addDays(d, -1)) {
    var active = state.habits.filter(function(h){ return h.start <= d; });
    if (!active.length) break;
    var allKept = active.every(function(h){ return !missedOn(h, d); });
    if (!allKept) break;
    n++;
  }
  return n;
}

function earliestStart(){
  return state.habits.reduce(function(a, h){
    return (a === null || h.start < a) ? h.start : a;
  }, null);
}

function missesThisMonth(){
  var pre = todayISO().slice(0, 7);
  return state.habits.reduce(function(a, h){
    return a + h.misses.filter(function(d){ return d.slice(0,7) === pre; }).length;
  }, 0);
}

/* ------------------------------------------------------------------ *
 * Mutations
 * ------------------------------------------------------------------ */
function habitById(id){
  for (var i = 0; i < state.habits.length; i++)
    if (state.habits[i].id === id) return state.habits[i];
  return null;
}

function toggleDay(id, d){
  var h = habitById(id);
  if (!h) return;
  var t = todayISO();
  if (d > t) { toast('That day has not happened yet'); return; }
  if (d < h.start) { toast('Before you started this habit'); return; }

  var i = h.misses.indexOf(d);
  if (i >= 0) h.misses.splice(i, 1);
  else h.misses.push(d);
  save();
  buzz(i >= 0 ? 12 : [10, 40, 10]);
  render();

  var name = h.name;
  var label = (d === t) ? 'today' : (d === addDays(t, -1) ? 'yesterday' : fmt(d, {day:'numeric', month:'short'}));
  toast(i >= 0 ? name + ' — back on for ' + label : name + ' — marked missed for ' + label);
}

function addHabit(name, icon){
  if (state.habits.length >= MAX) { toast('Five habits is the limit'); return false; }
  name = String(name || '').trim().slice(0, 40);
  if (!name) return false;
  var used = state.habits.map(function(h){ return h.color; });
  var color = PALETTE.filter(function(c){ return used.indexOf(c) < 0; })[0] || PALETTE[state.habits.length % PALETTE.length];
  state.habits.push({
    id: uid(), name: name, icon: icon || EMOJI[0], color: color,
    start: todayISO(), misses: []
  });
  save();
  return true;
}

function removeHabit(id){
  var h = habitById(id);
  if (!h) return;
  if (!confirm('Delete “' + h.name + '” and its history? This cannot be undone.')) return;
  state.habits = state.habits.filter(function(x){ return x.id !== id; });
  save(); render();
  toast('Deleted ' + h.name);
}

/* ------------------------------------------------------------------ *
 * Small helpers
 * ------------------------------------------------------------------ */
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function buzz(p){ try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

var toastTimer;
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('on'); }, 2200);
}

var CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.6l4.4 4.4L19 7"/></svg>';
var CROSS = '<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>';
var BIN   = '<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>';

/* ------------------------------------------------------------------ *
 * Views
 * ------------------------------------------------------------------ */
var view = 'today';
var openPicker = null;

/* Columns are weekdays: the strip always ends on today, and 7-day periodicity
   keeps every column on the same weekday however many rows we draw. */
function weekHead(){
  var t = todayISO(), out = [];
  for (var j = 0; j < 7; j++) {
    out.push('<i' + (j === 6 ? ' class="now"' : '') + '>' +
             esc(fmt(addDays(t, j - 6), {weekday:'narrow'})) + '</i>');
  }
  return out.join('');
}

function weekCells(h, rows){
  var t = todayISO(), out = [];
  for (var i = rows * 7 - 1; i >= 0; i--) {
    var d = addDays(t, -i);
    var st = dayState(h, d);
    out.push(
      '<button class="day" data-s="' + st + '" data-today="' + (d === t ? 1 : 0) + '"' +
        ' data-act="toggle" data-id="' + h.id + '" data-date="' + d + '"' +
        ' aria-label="' + esc(fmt(d, {weekday:'long', day:'numeric', month:'long'})) + ' — ' +
        (st === 'kept' ? 'done' : st === 'miss' ? 'missed' : 'not tracked') + '"></button>'
    );
  }
  return out.join('');
}

/* Cards are sized by their content, so the height each one gets is decided
   here: share out whatever the column has left after the banner and gaps, then
   spend each card's share on weeks of history instead of blank space. */
function fillWeeks(){
  var stack = document.querySelector('#v-today .stack');
  if (!stack || !state.habits.length) return;
  var cards = stack.querySelectorAll('.card');
  if (!cards.length) return;

  var first = cards[0];
  var body = first.querySelector('.body');
  var grid = first.querySelector('.wk-grid');
  if (!body || !grid) return;

  var gridH = grid.getBoundingClientRect().height;
  if (!(gridH > 0)) return;            /* strip hidden on very short screens */
  var rowH = gridH + 4;                /* one row + its gap */

  /* everything in the column that is not a card (the banner, any tip) */
  var fixed = 0;
  for (var k = 0; k < stack.children.length; k++) {
    var el = stack.children[k];
    if (!el.classList.contains('card')) fixed += el.getBoundingClientRect().height;
  }
  var gap = parseFloat(getComputedStyle(stack).rowGap) || 0;
  var share = (stack.clientHeight - fixed - gap * (stack.children.length - 1)) / cards.length;

  /* card height for R rows = chrome + R*rowH - 4, since the last row has no
     trailing gap; 1px of margin keeps sub-pixel rounding from overflowing */
  var chrome = first.getBoundingClientRect().height - grid.getBoundingClientRect().height;
  var rows = Math.floor((share - chrome + 4 - 1) / rowH);
  rows = Math.max(1, Math.min(rows, 12));

  /* Whole rows rarely divide the share exactly. Grow the squares to swallow the
     remainder — capped at the column width, since they must stay square. */
  var colW = (grid.getBoundingClientRect().width - 6 * 4) / 7;
  var ideal = (share - chrome + 4) / rows - 4;
  var dot = Math.max(rowH - 4, Math.min(colW, ideal));
  stack.style.setProperty('--dot', dot.toFixed(2) + 'px');

  if (rows < 2) return;
  for (var i = 0; i < cards.length; i++) {
    var h = habitById(cards[i].getAttribute('data-id'));
    if (h) cards[i].querySelector('.wk-grid').innerHTML = weekCells(h, rows);
  }
}

function renderToday(){
  var t = todayISO();
  var out = [];

  if (!state.habits.length) {
    document.getElementById('v-today').innerHTML =
      '<div class="stack"><div class="empty">' +
        '<div class="big">🎯</div>' +
        '<b>Nothing tracked yet</b>' +
        '<p>Pick up to five habits. Every day counts as done unless you say otherwise.</p>' +
        '<div class="chips">' +
          SUGGEST.map(function(s){
            return '<button class="chip" data-act="quickadd" data-name="' + esc(s.name) + '" data-icon="' + esc(s.icon) + '">' +
                   s.icon + ' ' + esc(s.name) + '</button>';
          }).join('') +
        '</div>' +
      '</div></div>';
    return;
  }

  var missedToday = state.habits.filter(function(h){ return missedOn(h, t); });
  var ps = perfectStreak();
  out.push(
    '<div class="banner">' +
      '<b>' + (missedToday.length === 0
        ? (ps > 1 ? '🔥 ' + plural(ps, 'perfect day') + ' in a row' : 'Nothing missed today')
        : plural(missedToday.length, 'habit') + ' marked missed today') + '</b>' +
      '<span>' + (missedToday.length === 0
        ? 'Days count themselves — tap only what you skipped.'
        : esc(missedToday.map(function(h){ return h.name; }).join(', ')) + ' · tap again to undo') + '</span>' +
    '</div>'
  );

  if (!localStorage.getItem(TIPKEY)) {
    out.push(
      '<div class="banner tip">' +
        '<div><b>How this works</b><span>Habits are assumed done. Tap the circle only on a day you did <em>not</em> do it.</span></div>' +
        '<button class="x" data-act="dismisstip" aria-label="Dismiss">×</button>' +
      '</div>'
    );
  }

  state.habits.forEach(function(h){
    var s = stats(h);
    var missed = missedOn(h, t);
    out.push(
      '<article class="card" data-id="' + h.id + '" style="--c:' + h.color + '">' +
        '<div class="body">' +
          '<div class="top">' +
            '<span class="emoji">' + esc(h.icon) + '</span>' +
            '<h2>' + esc(h.name) + '</h2>' +
            (s.cur > 0
              ? '<span class="flame">🔥 ' + s.cur + '</span>'
              : '<span class="broken">start again</span>') +
          '</div>' +
          '<div class="week"><div class="wk-head">' + weekHead() + '</div>' +
            '<div class="wk-grid">' + weekCells(h, 1) + '</div></div>' +
        '</div>' +
        '<button class="mark" data-state="' + (missed ? 'missed' : 'kept') + '"' +
          ' data-act="toggle" data-id="' + h.id + '" data-date="' + t + '"' +
          ' aria-pressed="' + (missed ? 'false' : 'true') + '"' +
          ' aria-label="' + esc(h.name) + ' today: ' + (missed ? 'missed — tap to undo' : 'done — tap if you missed it') + '">' +
          (missed ? CROSS : CHECK) +
        '</button>' +
      '</article>'
    );
  });

  document.getElementById('v-today').innerHTML =
    '<div class="stack" data-n="' + state.habits.length + '">' + out.join('') + '</div>';
  fillWeeks();
}

function renderInsights(){
  var el = document.getElementById('v-insights');
  if (!state.habits.length) {
    el.innerHTML = '<div class="stack"><div class="empty"><div class="big">📈</div><b>No data yet</b>' +
      '<p>Add a habit and your streaks, rates and calendar show up here.</p></div></div>';
    return;
  }

  var t = todayISO();
  var first = earliestStart();
  var bestOverall = state.habits.reduce(function(a, h){ return Math.max(a, stats(h).best); }, 0);
  var out = [];

  out.push(
    '<div class="summary">' +
      '<div><b>' + perfectStreak() + '</b><span>perfect days</span></div>' +
      '<div><b>' + bestOverall + '</b><span>best streak</span></div>' +
      '<div><b>' + (diffDays(first, t) + 1) + '</b><span>days logged</span></div>' +
      '<div><b>' + missesThisMonth() + '</b><span>missed in ' + esc(fmt(t, {month:'short'})) + '</span></div>' +
    '</div>'
  );

  /* five weeks of squares, weekday-aligned, ending with the week containing today */
  var startWeekday = (parseISO(t).getDay() + 6) % 7;   /* 0 = Monday */
  var lastCell = addDays(t, 6 - startWeekday);         /* Sunday of this week */

  state.habits.forEach(function(h){
    var s = stats(h);
    var cells = [];
    for (var i = 34; i >= 0; i--) {
      var d = addDays(lastCell, -i);
      var st = dayState(h, d);
      cells.push(
        '<button data-s="' + st + '" data-today="' + (d === t ? 1 : 0) + '"' +
        ' data-act="toggle" data-id="' + h.id + '" data-date="' + d + '"' +
        ' aria-label="' + esc(fmt(d, {day:'numeric', month:'long'})) + ' — ' +
        (st === 'kept' ? 'done' : st === 'miss' ? 'missed' : 'not tracked') + '"></button>'
      );
    }

    out.push(
      '<div class="isect" style="--c:' + h.color + '">' +
        '<div class="ileft">' +
          '<div class="itop"><span class="emoji">' + esc(h.icon) + '</span><h3>' + esc(h.name) + '</h3></div>' +
          '<div class="inums">' +
            '<span><b>' + s.cur + '</b>now</span>' +
            '<span><b>' + s.best + '</b>best</span>' +
            '<span><b>' + s.misses + '</b>miss</span>' +
            '<span><b>' + Math.round(s.recentRate * 100) + '%</b>' + s.recentTotal + 'd</span>' +
          '</div>' +
        '</div>' +
        '<div class="ical">' + cells.join('') + '</div>' +
      '</div>'
    );
  });

  out.push(
    '<div class="legend">' +
      '<span><i style="background:linear-gradient(135deg,#16a34a,#0ea5e9,#f59e0b,#ec4899)"></i>done</span>' +
      '<span><i style="border:1.5px dashed var(--miss)"></i>missed</span>' +
      '<span><i style="background:var(--untracked)"></i>untracked</span>' +
      '<span>tap a square to fix it</span>' +
    '</div>'
  );

  el.innerHTML = '<div class="stack" data-n="' + state.habits.length + '">' + out.join('') + '</div>';
}

function renderHabits(){
  var out = [];

  state.habits.forEach(function(h){
    var s = stats(h);
    out.push(
      '<div class="row" style="--c:' + h.color + '">' +
        '<div class="line">' +
          '<button class="emo" data-act="picker" data-id="' + h.id + '"' +
            ' aria-expanded="' + (openPicker === h.id) + '"' +
            ' aria-label="Icon and colour for ' + esc(h.name) + '">' + esc(h.icon) + '</button>' +
          '<input type="text" value="' + esc(h.name) + '" maxlength="40" data-act="rename" data-id="' + h.id + '" aria-label="Habit name">' +
          '<button class="del" data-act="delete" data-id="' + h.id + '" aria-label="Delete ' + esc(h.name) + '">' + BIN + '</button>' +
        '</div>' +
        (openPicker === h.id
          ? '<div class="panel">' +
              '<div class="emopick">' + EMOJI.map(function(e){
                return '<button data-act="seticon" data-id="' + h.id + '" data-icon="' + esc(e) + '"' +
                       ' aria-pressed="' + (e === h.icon) + '">' + e + '</button>';
              }).join('') + '</div>' +
              '<div class="swatches">' +
                PALETTE.map(function(c){
                  return '<button class="sw" data-act="setcolor" data-id="' + h.id + '" data-color="' + c + '"' +
                         ' aria-pressed="' + (c === h.color) + '" aria-label="Colour ' + c + '"><i style="background:' + c + '"></i></button>';
                }).join('') +
                '<span class="meta">since ' + esc(fmt(h.start, {day:'numeric', month:'short'})) +
                  ' · ' + s.kept + '/' + s.total + ' kept</span>' +
              '</div>' +
            '</div>'
          : '') +
      '</div>'
    );
  });

  if (state.habits.length < MAX) {
    out.push(
      '<div class="addbox"><div class="line">' +
        '<input type="text" id="newName" placeholder="New habit" maxlength="40" enterkeyhint="done">' +
        '<button class="btn" data-act="add">Add</button>' +
      '</div></div>' +
      '<p class="hint">' + (MAX - state.habits.length) + ' of ' + MAX + ' free · tap an icon to restyle</p>'
    );
  } else {
    out.push('<p class="hint">Five is the maximum — delete one to swap it out.</p>');
  }

  out.push(
    '<div class="sect">' +
      '<h3>Your data</h3>' +
      '<div class="btnrow">' +
        '<button class="btn ghost" data-act="export">Export</button>' +
        '<button class="btn ghost" data-act="import">Import</button>' +
        '<button class="btn ghost" data-act="reset">Erase</button>' +
      '</div>' +
      '<p class="note">This browser only, never uploaded. Export a backup now and then.</p>' +
      '<input type="file" id="fileIn" accept="application/json,.json" hidden>' +
    '</div>'
  );

  document.getElementById('v-habits').innerHTML = '<div class="stack">' + out.join('') + '</div>';
}

function render(){
  var t = todayISO();
  document.getElementById('vTitle').textContent =
    view === 'today' ? 'Today' : view === 'insights' ? 'Insights' : 'Habits';
  document.getElementById('vSub').textContent =
    view === 'today'   ? fmt(t, {weekday:'long', day:'numeric', month:'long'}) :
    view === 'insights'? (state.habits.length ? 'Streaks, rates and calendars' : 'Nothing to show yet') :
                         'Up to ' + MAX + ' habits, edited here';

  document.getElementById('v-today').hidden    = view !== 'today';
  document.getElementById('v-insights').hidden = view !== 'insights';
  document.getElementById('v-habits').hidden   = view !== 'habits';

  if (view === 'today')    renderToday();
  if (view === 'insights') renderInsights();
  if (view === 'habits')   renderHabits();
}

function setView(v){
  var m = document.querySelector('main');
  if (view === v) { m.scrollTo({ top:0, behavior:'smooth' }); return; }
  view = v;
  openPicker = null;
  Array.prototype.forEach.call(document.querySelectorAll('nav button'), function(b){
    b.setAttribute('aria-selected', String(b.dataset.view === v));
  });
  render();
  m.scrollTop = 0;
}

/* ------------------------------------------------------------------ *
 * Data import / export
 * ------------------------------------------------------------------ */
function exportData(){
  var blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'habits-' + todayISO() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  toast('Backup downloaded');
}

function importData(file){
  var r = new FileReader();
  r.onload = function(){
    try {
      var d = JSON.parse(String(r.result));
      if (!d || !Array.isArray(d.habits)) throw new Error('bad shape');
      if (!confirm('Replace your current habits with ' + d.habits.length + ' from this backup?')) return;
      state = { v:1, habits: d.habits.slice(0, MAX).map(normalise) };
      save(); render();
      toast('Backup restored');
    } catch (e) {
      toast('That file is not a habits backup');
    }
  };
  r.onerror = function(){ toast('Could not read that file'); };
  r.readAsText(file);
}

/* ------------------------------------------------------------------ *
 * Theme
 * ------------------------------------------------------------------ */
var SUN  = '<circle cx="12" cy="12" r="4.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/>';
var MOON = '<path d="M20 14.5A8.2 8.2 0 019.6 4 8.5 8.5 0 1020 14.5z"/>';
var AUTO = '<circle cx="12" cy="12" r="8.4"/><path d="M12 3.6v16.8" /><path d="M12 3.6a8.4 8.4 0 010 16.8" fill="currentColor" stroke="none"/>';

function applyTheme(){
  var th = localStorage.getItem(THKEY) || 'auto';
  document.documentElement.setAttribute('data-theme', th);
  document.getElementById('themeIcon').innerHTML = th === 'light' ? SUN : th === 'dark' ? MOON : AUTO;
  document.getElementById('themeBtn').setAttribute(
    'aria-label', 'Theme: ' + th + ' — tap to change');
}
function cycleTheme(){
  var order = ['auto','light','dark'];
  var cur = localStorage.getItem(THKEY) || 'auto';
  var next = order[(order.indexOf(cur) + 1) % order.length];
  localStorage.setItem(THKEY, next);
  applyTheme();
  toast('Theme: ' + next);
}

/* ------------------------------------------------------------------ *
 * Events
 * ------------------------------------------------------------------ */
document.addEventListener('click', function(ev){
  var tab = ev.target.closest('nav button');
  if (tab) { setView(tab.dataset.view); return; }

  if (ev.target.closest('#themeBtn')) { cycleTheme(); return; }

  var el = ev.target.closest('[data-act]');
  if (!el) return;
  var act = el.dataset.act;

  if (act === 'toggle')     { toggleDay(el.dataset.id, el.dataset.date); }
  else if (act === 'quickadd') {
    if (addHabit(el.dataset.name, el.dataset.icon)) { render(); toast('Added ' + el.dataset.name); }
  }
  else if (act === 'dismisstip') { localStorage.setItem(TIPKEY, '1'); render(); }
  else if (act === 'delete')  { removeHabit(el.dataset.id); }
  else if (act === 'picker')  { openPicker = openPicker === el.dataset.id ? null : el.dataset.id; render(); }
  else if (act === 'seticon') {
    var hi = habitById(el.dataset.id);
    if (hi) { hi.icon = el.dataset.icon; save(); openPicker = null; render(); }
  }
  else if (act === 'setcolor') {
    var hc = habitById(el.dataset.id);
    if (hc) { hc.color = el.dataset.color; save(); render(); }
  }
  else if (act === 'add') {
    var inp = document.getElementById('newName');
    if (!inp.value.trim()) { inp.focus(); return; }
    var nm = inp.value.trim();
    if (addHabit(nm)) { render(); toast('Added ' + nm); }
  }
  else if (act === 'export') { exportData(); }
  else if (act === 'import') { document.getElementById('fileIn').click(); }
  else if (act === 'reset') {
    if (confirm('Erase all habits and history? This cannot be undone.')) {
      state = { v:1, habits:[] };
      save(); render(); toast('Everything erased');
    }
  }
});

document.addEventListener('input', function(ev){
  var el = ev.target;
  if (el.dataset && el.dataset.act === 'rename') {
    var h = habitById(el.dataset.id);
    if (h) { h.name = el.value.slice(0, 40); save(); }
  }
});

document.addEventListener('change', function(ev){
  if (ev.target.id === 'fileIn' && ev.target.files && ev.target.files[0]) {
    importData(ev.target.files[0]);
    ev.target.value = '';
  }
});

document.addEventListener('keydown', function(ev){
  if (ev.key === 'Enter' && ev.target.id === 'newName') {
    ev.preventDefault();
    var nm = ev.target.value.trim();
    if (addHabit(nm)) { render(); toast('Added ' + nm); }
  }
  if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.act === 'rename') ev.target.blur();
});

/* roll over at midnight, and whenever the app comes back to the foreground */
var lastDay = todayISO();
function checkDay(){
  var t = todayISO();
  if (t !== lastDay) { lastDay = t; render(); }
}
setInterval(checkDay, 30000);
addEventListener('resize', function(){ if (view === 'today') render(); });
document.addEventListener('visibilitychange', function(){ if (!document.hidden) checkDay(); });

/* ------------------------------------------------------------------ *
 * Go
 * ------------------------------------------------------------------ */
applyTheme();
render();

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* offline is a bonus, not a requirement */ });
  });
}
})();
</script>
</body>
</html>
