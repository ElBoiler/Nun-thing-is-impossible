<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Streaks — Habit Tracker</title>
<meta name="description" content="A tiny offline habit tracker. Five habits, one tap a day, honest streaks.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Streaks">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --card-2:#fafbfc;
  --text:#11151c; --muted:#6b7280; --faint:#9aa1ab;
  --line:#e6e8ec; --line-strong:#d6d9df;
  --miss:#e5484d; --untracked:#e3e5e9;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 6px 16px rgba(16,24,40,.05);
  --radius:16px;
  --tap:#00000010;
}
:root[data-theme="dark"]{
  --bg:#0e1116; --card:#171b22; --card-2:#1d222b;
  --text:#e9edf3; --muted:#98a1ae; --faint:#6b7482;
  --line:#242a33; --line-strong:#323a45;
  --miss:#ff6369; --untracked:#262c35;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  --tap:#ffffff14;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --card:#171b22; --card-2:#1d222b;
    --text:#e9edf3; --muted:#98a1ae; --faint:#6b7482;
    --line:#242a33; --line-strong:#323a45;
    --miss:#ff6369; --untracked:#262c35;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    --tap:#ffffff14;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(12px);
  backdrop-filter:saturate(1.6) blur(12px);
  border-bottom:1px solid transparent;
  padding-top:max(10px, env(safe-area-inset-top));
}
header.scrolled{border-bottom-color:var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 10px}
.htitle h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
.htitle p{font-size:13px;color:var(--muted);margin-top:1px}
.icon-btn{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--muted);
}
.icon-btn:active{background:var(--card-2)}
.icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- layout ---------- */
main{padding:8px 0 calc(88px + env(safe-area-inset-bottom))}
.view[hidden]{display:none}
.stack{display:flex;flex-direction:column;gap:12px}

/* ---------- today ---------- */
.banner{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow);
}
.banner b{display:block;font-size:15px;margin-bottom:2px}
.banner span{font-size:13.5px;color:var(--muted)}
.banner.tip{display:flex;gap:12px;align-items:flex-start}
.banner.tip .x{margin-left:auto;color:var(--faint);font-size:20px;line-height:1;padding:2px 4px}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px 14px 12px;
  display:flex;gap:14px;align-items:flex-start;
}
.card .body{flex:1;min-width:0}
.card .top{display:flex;align-items:center;gap:8px;min-width:0}
.card .emoji{font-size:19px;line-height:1}
.card h2{font-size:16.5px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sub{font-size:13px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .sub .flame{color:var(--c)}
.pill{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--card-2);border:1px solid var(--line);color:var(--muted)}

/* the big daily button */
.mark{
  flex:none;width:56px;height:56px;border-radius:50%;
  display:grid;place-items:center;position:relative;
  border:2px solid var(--c);background:var(--c);color:#fff;
  transition:transform .12s ease, background .15s ease, border-color .15s ease;
}
.mark svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.mark:active{transform:scale(.9)}
.mark[data-state="missed"]{background:transparent;border-color:var(--miss);color:var(--miss);border-style:dashed}
.mark[data-state="missed"] svg{stroke-width:2.4}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.day{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:4px 0 2px;border-radius:9px;
}
.day:active{background:var(--tap)}
.day i{font-style:normal;font-size:10px;color:var(--faint);letter-spacing:.02em}
.day b{
  width:100%;max-width:26px;aspect-ratio:1;border-radius:7px;display:block;
  background:var(--untracked);
}
.day[data-s="kept"] b{background:var(--c)}
.day[data-s="miss"] b{background:transparent;border:1.5px dashed var(--miss)}
.day[data-s="none"] b{background:var(--untracked);opacity:.55}
.day[data-today="1"] i{color:var(--text);font-weight:700}
.day[data-today="1"] b{outline:2px solid var(--line-strong);outline-offset:2px}

/* ---------- empty state ---------- */
.empty{text-align:center;padding:34px 18px 26px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.empty .big{font-size:34px}
.empty b{display:block;margin:10px 0 4px;font-size:17px}
.empty p{font-size:14px;color:var(--muted);max-width:34ch;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chip{
  border:1px solid var(--line);background:var(--card-2);border-radius:99px;
  padding:8px 13px;font-size:14px;font-weight:550;
}
.chip:active{background:var(--tap)}

/* ---------- insights ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--muted);letter-spacing:.01em}
.stat .v{font-size:27px;font-weight:700;letter-spacing:-.03em;margin-top:2px;line-height:1.1}
.stat .v small{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0}
.stat .n{font-size:12px;color:var(--faint);margin-top:2px}

.sect{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.sect > .head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sect > .head h3{font-size:16px;font-weight:650;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.trio div{background:var(--card-2);border:1px solid var(--line);border-radius:11px;padding:8px 9px}
.trio .v{font-size:19px;font-weight:700;letter-spacing:-.02em}
.trio .k{font-size:11px;color:var(--muted);margin-top:1px}
.bar{height:7px;border-radius:99px;background:var(--untracked);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c)}
.barlab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:9px 0 5px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.cal .h{font-size:10px;color:var(--faint);text-align:center;padding-bottom:1px}
.cal button{aspect-ratio:1;border-radius:5px;background:var(--untracked);width:100%}
.cal button[data-s="kept"]{background:var(--c)}
.cal button[data-s="miss"]{background:transparent;border:1.5px dashed var(--miss)}
.cal button[data-s="none"]{opacity:.45}
.cal button[data-today="1"]{outline:2px solid var(--line-strong);outline-offset:1.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:12px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3.5px;display:block}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}

/* ---------- habits (manage) ---------- */
.row{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:11px 12px}
.row .line{display:flex;align-items:center;gap:9px}
.row .emo{width:40px;height:40px;flex:none;border-radius:11px;background:var(--card-2);border:1px solid var(--line);font-size:19px;display:grid;place-items:center}
.row input[type=text]{
  flex:1;min-width:0;background:transparent;border:0;border-bottom:1px dashed var(--line-strong);
  padding:7px 2px;font-size:15.5px;font-weight:550;
}
.row input[type=text]:focus{outline:none;border-bottom-style:solid;border-bottom-color:var(--text)}
.del{width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center;color:var(--faint)}
.del:active{background:var(--tap);color:var(--miss)}
.del svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.swatches{display:flex;gap:7px;margin-top:9px;padding-left:49px;flex-wrap:wrap;align-items:center}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;position:relative}
.sw i{position:absolute;inset:2px;border-radius:50%;display:block}
.sw[aria-pressed="true"]{border-color:var(--text)}
.emopick{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:10px}
.emopick button{aspect-ratio:1;border-radius:9px;background:var(--card-2);border:1px solid var(--line);font-size:18px}
.emopick button[aria-pressed="true"]{border-color:var(--text)}
.meta-line{font-size:12px;color:var(--faint);padding-left:49px;margin-top:6px}

.addbox{background:var(--card);border:1px dashed var(--line-strong);border-radius:var(--radius);padding:12px}
.addbox .line{display:flex;gap:8px}
.addbox input{
  flex:1;min-width:0;background:var(--card-2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:15.5px;
}
.addbox input:focus{outline:none;border-color:var(--line-strong)}
.btn{
  border-radius:11px;padding:11px 15px;font-size:15px;font-weight:600;
  background:var(--text);color:var(--bg);
}
.btn:active{opacity:.8}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.ghost:active{background:var(--card-2)}
.btn[disabled]{opacity:.4}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1;min-width:120px;text-align:center}
.hint{font-size:12.5px;color:var(--muted);text-align:center;padding:2px 8px 0}

/* ---------- tab bar ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(12px);
  backdrop-filter:saturate(1.6) blur(12px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav button{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 0 7px;color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.01em;
}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--text)}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;transform:translate(-50%,20px);
  bottom:calc(84px + env(safe-area-inset-bottom));z-index:50;
  background:var(--text);color:var(--bg);
  padding:9px 15px;border-radius:99px;font-size:13.5px;font-weight:550;
  opacity:0;pointer-events:none;transition:opacity .18s ease, transform .18s ease;
  max-width:calc(100vw - 40px);text-align:center;
}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<header id="hdr">
  <div class="wrap hrow">
    <div class="htitle">
      <h1 id="vTitle">Today</h1>
      <p id="vSub"></p>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Switch theme">
      <svg id="themeIcon" viewBox="0 0 24 24"></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <section id="v-today" class="view"></section>
  <section id="v-insights" class="view" hidden></section>
  <section id="v-habits" class="view" hidden></section>
</main>

<nav>
  <div class="inner" role="tablist">
    <button role="tab" data-view="today" aria-selected="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.4 12.4l2.5 2.5 4.7-5.2"/></svg>
      <span>Today</span>
    </button>
    <button role="tab" data-view="insights" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M5 20V12M12 20V4M19 20v-6"/></svg>
      <span>Insights</span>
    </button>
    <button role="tab" data-view="habits" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M4 7h9M17.5 7H20M4 17h3M11.5 17H20"/><circle cx="15.5" cy="7" r="2.2"/><circle cx="9.5" cy="17" r="2.2"/></svg>
      <span>Habits</span>
    </button>
  </div>
</nav>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ------------------------------------------------------------------ *
 * Constants
 * ------------------------------------------------------------------ */
var KEY   = 'nti-habits-v1';
var TIPKEY= 'nti-habits-tip';
var THKEY = 'nti-habits-theme';
var MAX   = 5;
var DAY   = 86400000;

var PALETTE = ['#16a34a','#0ea5e9','#f59e0b','#ec4899','#8b5cf6'];
var EMOJI   = ['✅','💧','🏃','📚','🧘','🥗','💤','🦷','🎸','✍️','🚶','💪','☎️','🌱','🧹','🎯'];
var SUGGEST = [
  {icon:'💧', name:'Drink water'},
  {icon:'🏃', name:'Move 30 min'},
  {icon:'📚', name:'Read'},
  {icon:'🧘', name:'Meditate'},
  {icon:'💤', name:'Bed by 11'}
];

/* ------------------------------------------------------------------ *
 * Dates — everything is local-time "YYYY-MM-DD", never UTC
 * ------------------------------------------------------------------ */
function iso(d){
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}
function parseISO(s){
  var p = s.split('-');
  return new Date(+p[0], +p[1]-1, +p[2]);
}
function todayISO(){ return iso(new Date()); }
function addDays(s, n){
  var d = parseISO(s); d.setDate(d.getDate()+n); return iso(d);
}
function diffDays(a, b){ /* whole days from a to b, DST-safe */
  return Math.round((parseISO(b) - parseISO(a)) / DAY);
}
function isISO(s){ return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
function fmt(s, opts){ return parseISO(s).toLocaleDateString(undefined, opts); }
function plural(n, word){ return n + ' ' + word + (n === 1 ? '' : 's'); }

/* ------------------------------------------------------------------ *
 * Storage
 * ------------------------------------------------------------------ */
function uid(){ return Math.random().toString(36).slice(2, 9); }

function normalise(h, i){
  return {
    id:     typeof h.id === 'string' ? h.id : uid(),
    name:   String(h.name == null ? 'Habit' : h.name).slice(0, 40) || 'Habit',
    icon:   typeof h.icon === 'string' ? h.icon : EMOJI[0],
    color:  /^#[0-9a-f]{6}$/i.test(h.color) ? h.color : PALETTE[i % PALETTE.length],
    start:  isISO(h.start) ? h.start : todayISO(),
    misses: Array.isArray(h.misses) ? h.misses.filter(isISO).filter(uniq) : []
  };
}
function uniq(v, i, a){ return a.indexOf(v) === i; }

function load(){
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return { v:1, habits:[] };
    var d = JSON.parse(raw);
    if (!d || !Array.isArray(d.habits)) return { v:1, habits:[] };
    return { v:1, habits: d.habits.slice(0, MAX).map(normalise) };
  } catch (e) {
    return { v:1, habits:[] };
  }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { toast('Could not save — storage is full or blocked'); }
}

var state = load();

/* ------------------------------------------------------------------ *
 * Stats
 * ------------------------------------------------------------------ */
function missedOn(h, d){ return h.misses.indexOf(d) >= 0; }

/* A day is one of: 'kept' (assumed done), 'miss' (tapped off), 'none' (before
   the habit existed, or in the future). */
function dayState(h, d){
  var t = todayISO();
  if (d < h.start || d > t) return 'none';
  return missedOn(h, d) ? 'miss' : 'kept';
}

function stats(h){
  var today = todayISO();
  var start = h.start > today ? today : h.start;
  var cur = 0, best = 0, run = 0, kept = 0, total = 0;
  var recentWin = 30, recentKept = 0, recentTotal = 0;
  var recentFrom = addDays(today, -(recentWin - 1));

  for (var d = start; ; d = addDays(d, 1)) {
    total++;
    var ok = !missedOn(h, d);
    if (ok) { run++; kept++; if (run > best) best = run; } else { run = 0; }
    if (d >= recentFrom) { recentTotal++; if (ok) recentKept++; }
    if (d === today) { cur = ok ? run : 0; break; }
    if (total > 20000) break; /* paranoia guard */
  }
  return {
    cur: cur, best: best, kept: kept, total: total,
    misses: total - kept,
    rate: total ? kept / total : 1,
    recentRate: recentTotal ? recentKept / recentTotal : 1,
    recentTotal: recentTotal, recentMisses: recentTotal - recentKept
  };
}

/* Consecutive days, ending today, on which every habit alive that day was kept. */
function perfectStreak(){
  if (!state.habits.length) return 0;
  var n = 0;
  for (var d = todayISO(); n < 3700; d = addDays(d, -1)) {
    var active = state.habits.filter(function(h){ return h.start <= d; });
    if (!active.length) break;
    var allKept = active.every(function(h){ return !missedOn(h, d); });
    if (!allKept) break;
    n++;
  }
  return n;
}

function earliestStart(){
  return state.habits.reduce(function(a, h){
    return (a === null || h.start < a) ? h.start : a;
  }, null);
}

function missesThisMonth(){
  var pre = todayISO().slice(0, 7);
  return state.habits.reduce(function(a, h){
    return a + h.misses.filter(function(d){ return d.slice(0,7) === pre; }).length;
  }, 0);
}

/* ------------------------------------------------------------------ *
 * Mutations
 * ------------------------------------------------------------------ */
function habitById(id){
  for (var i = 0; i < state.habits.length; i++)
    if (state.habits[i].id === id) return state.habits[i];
  return null;
}

function toggleDay(id, d){
  var h = habitById(id);
  if (!h) return;
  var t = todayISO();
  if (d > t) { toast('That day has not happened yet'); return; }
  if (d < h.start) { toast('Before you started this habit'); return; }

  var i = h.misses.indexOf(d);
  if (i >= 0) h.misses.splice(i, 1);
  else h.misses.push(d);
  save();
  buzz(i >= 0 ? 12 : [10, 40, 10]);
  render();

  var name = h.name;
  var label = (d === t) ? 'today' : (d === addDays(t, -1) ? 'yesterday' : fmt(d, {day:'numeric', month:'short'}));
  toast(i >= 0 ? name + ' — back on for ' + label : name + ' — marked missed for ' + label);
}

function addHabit(name, icon){
  if (state.habits.length >= MAX) { toast('Five habits is the limit'); return false; }
  name = String(name || '').trim().slice(0, 40);
  if (!name) return false;
  var used = state.habits.map(function(h){ return h.color; });
  var color = PALETTE.filter(function(c){ return used.indexOf(c) < 0; })[0] || PALETTE[state.habits.length % PALETTE.length];
  state.habits.push({
    id: uid(), name: name, icon: icon || EMOJI[0], color: color,
    start: todayISO(), misses: []
  });
  save();
  return true;
}

function removeHabit(id){
  var h = habitById(id);
  if (!h) return;
  if (!confirm('Delete “' + h.name + '” and its history? This cannot be undone.')) return;
  state.habits = state.habits.filter(function(x){ return x.id !== id; });
  save(); render();
  toast('Deleted ' + h.name);
}

/* ------------------------------------------------------------------ *
 * Small helpers
 * ------------------------------------------------------------------ */
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function buzz(p){ try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

var toastTimer;
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('on'); }, 2200);
}

var CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.6l4.4 4.4L19 7"/></svg>';
var CROSS = '<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>';
var BIN   = '<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>';

/* ------------------------------------------------------------------ *
 * Views
 * ------------------------------------------------------------------ */
var view = 'today';
var openPicker = null;

function renderToday(){
  var t = todayISO();
  var out = [];

  if (!state.habits.length) {
    out.push(
      '<div class="empty">' +
        '<div class="big">🎯</div>' +
        '<b>Nothing tracked yet</b>' +
        '<p>Pick up to five habits. Every day counts as done unless you say otherwise.</p>' +
        '<div class="chips">' +
          SUGGEST.map(function(s){
            return '<button class="chip" data-act="quickadd" data-name="' + esc(s.name) + '" data-icon="' + esc(s.icon) + '">' +
                   s.icon + ' ' + esc(s.name) + '</button>';
          }).join('') +
        '</div>' +
      '</div>'
    );
    document.getElementById('v-today').innerHTML = '<div class="stack">' + out.join('') + '</div>';
    return;
  }

  var missedToday = state.habits.filter(function(h){ return missedOn(h, t); });
  var ps = perfectStreak();
  out.push(
    '<div class="banner">' +
      '<b>' + (missedToday.length === 0
        ? (ps > 1 ? '🔥 ' + plural(ps, 'perfect day') + ' in a row' : 'All five-star so far today')
        : plural(missedToday.length, 'habit') + ' marked missed today') + '</b>' +
      '<span>' + (missedToday.length === 0
        ? 'Nothing to do — days count themselves.'
        : esc(missedToday.map(function(h){ return h.name; }).join(', ')) + ' · tap again to undo') + '</span>' +
    '</div>'
  );

  if (!localStorage.getItem(TIPKEY)) {
    out.push(
      '<div class="banner tip">' +
        '<div><b>How this works</b><span>Habits are assumed done. Tap the circle only on a day you did <em>not</em> do it.</span></div>' +
        '<button class="x" data-act="dismisstip" aria-label="Dismiss">×</button>' +
      '</div>'
    );
  }

  state.habits.forEach(function(h){
    var s = stats(h);
    var missed = missedOn(h, t);
    var days = [];
    for (var i = 6; i >= 0; i--) {
      var d = addDays(t, -i);
      var st = dayState(h, d);
      days.push(
        '<button class="day" data-s="' + st + '" data-today="' + (d === t ? 1 : 0) + '"' +
          ' data-act="toggle" data-id="' + h.id + '" data-date="' + d + '"' +
          ' aria-label="' + esc(fmt(d, {weekday:'long', day:'numeric', month:'long'})) + ' — ' +
          (st === 'kept' ? 'done' : st === 'miss' ? 'missed' : 'not tracked') + '">' +
          '<i>' + esc(fmt(d, {weekday:'narrow'})) + '</i><b></b>' +
        '</button>'
      );
    }

    out.push(
      '<article class="card" style="--c:' + h.color + '">' +
        '<div class="body">' +
          '<div class="top"><span class="emoji">' + esc(h.icon) + '</span><h2>' + esc(h.name) + '</h2></div>' +
          '<div class="sub">' +
            (s.cur > 0
              ? '<span class="flame">🔥 ' + plural(s.cur, 'day') + '</span>'
              : '<span>Streak broken — restart today</span>') +
            (s.best > s.cur && s.best > 1 ? '<span class="pill">best ' + s.best + '</span>' : '') +
          '</div>' +
          '<div class="week">' + days.join('') + '</div>' +
        '</div>' +
        '<button class="mark" data-state="' + (missed ? 'missed' : 'kept') + '"' +
          ' data-act="toggle" data-id="' + h.id + '" data-date="' + t + '"' +
          ' aria-pressed="' + (missed ? 'false' : 'true') + '"' +
          ' aria-label="' + esc(h.name) + ' today: ' + (missed ? 'missed — tap to undo' : 'done — tap if you missed it') + '">' +
          (missed ? CROSS : CHECK) +
        '</button>' +
      '</article>'
    );
  });

  document.getElementById('v-today').innerHTML = '<div class="stack">' + out.join('') + '</div>';
}

function renderInsights(){
  var el = document.getElementById('v-insights');
  if (!state.habits.length) {
    el.innerHTML = '<div class="empty"><div class="big">📈</div><b>No data yet</b>' +
      '<p>Add a habit and your streaks, rates and calendar show up here.</p></div>';
    return;
  }

  var t = todayISO();
  var ps = perfectStreak();
  var first = earliestStart();
  var logged = diffDays(first, t) + 1;
  var bestOverall = state.habits.reduce(function(a, h){ return Math.max(a, stats(h).best); }, 0);
  var out = [];

  out.push(
    '<div class="grid2">' +
      '<div class="stat"><div class="k">Perfect-day streak</div><div class="v">' + ps + ' <small>' + (ps === 1 ? 'day' : 'days') + '</small></div>' +
        '<div class="n">every habit kept</div></div>' +
      '<div class="stat"><div class="k">Longest streak</div><div class="v">' + bestOverall + ' <small>' + (bestOverall === 1 ? 'day' : 'days') + '</small></div>' +
        '<div class="n">across all habits</div></div>' +
      '<div class="stat"><div class="k">Days logged</div><div class="v">' + logged + '</div>' +
        '<div class="n">since ' + esc(fmt(first, {day:'numeric', month:'short', year:'numeric'})) + '</div></div>' +
      '<div class="stat"><div class="k">Misses this month</div><div class="v">' + missesThisMonth() + '</div>' +
        '<div class="n">' + esc(fmt(t, {month:'long'})) + '</div></div>' +
    '</div>'
  );

  state.habits.forEach(function(h){
    var s = stats(h);
    var pct = Math.round(s.recentRate * 100);

    /* 5-week calendar, columns aligned to weekdays, ending with today's week */
    var startWeekday = (parseISO(t).getDay() + 6) % 7;      /* 0 = Monday */
    var lastCell = addDays(t, 6 - startWeekday);            /* Sunday of this week */
    var cells = [];
    var heads = [];
    for (var w = 0; w < 7; w++) {
      heads.push('<div class="h">' + esc(fmt(addDays(t, w - startWeekday), {weekday:'narrow'})) + '</div>');
    }
    for (var i = 34; i >= 0; i--) {
      var d = addDays(lastCell, -i);
      var st = dayState(h, d);
      cells.push(
        '<button data-s="' + st + '" data-today="' + (d === t ? 1 : 0) + '"' +
        ' data-act="toggle" data-id="' + h.id + '" data-date="' + d + '"' +
        ' aria-label="' + esc(fmt(d, {day:'numeric', month:'long'})) + ' — ' +
        (st === 'kept' ? 'done' : st === 'miss' ? 'missed' : 'not tracked') + '"></button>'
      );
    }

    var goal;
    if (s.cur === 0) goal = 'Tap today’s circle back on, or just start again tomorrow.';
    else if (s.cur >= s.best) goal = 'You are at your all-time best. Keep going.';
    else goal = plural(s.best - s.cur, 'day') + ' to beat your best of ' + s.best + '.';

    out.push(
      '<div class="sect" style="--c:' + h.color + '">' +
        '<div class="head"><span class="emoji">' + esc(h.icon) + '</span><h3>' + esc(h.name) + '</h3></div>' +
        '<div class="trio">' +
          '<div><div class="v" style="color:' + h.color + '">' + s.cur + '</div><div class="k">current</div></div>' +
          '<div><div class="v">' + s.best + '</div><div class="k">best</div></div>' +
          '<div><div class="v">' + s.misses + '</div><div class="k">misses</div></div>' +
        '</div>' +
        '<div class="barlab"><span>Last ' + s.recentTotal + ' days</span><span>' + pct + '%</span></div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="cal">' + heads.join('') + cells.join('') + '</div>' +
        '<div class="note">' + esc(goal) + '</div>' +
      '</div>'
    );
  });

  out.push(
    '<div class="legend">' +
      '<span><i style="background:linear-gradient(135deg,#16a34a,#0ea5e9,#f59e0b,#ec4899)"></i>done</span>' +
      '<span><i style="border:1.5px dashed var(--miss)"></i>missed</span>' +
      '<span><i style="background:var(--untracked)"></i>not tracked</span>' +
      '<span>tap any square to correct it</span>' +
    '</div>'
  );

  el.innerHTML = '<div class="stack">' + out.join('') + '</div>';
}

function renderHabits(){
  var out = [];

  state.habits.forEach(function(h){
    var s = stats(h);
    out.push(
      '<div class="row" style="--c:' + h.color + '">' +
        '<div class="line">' +
          '<button class="emo" data-act="picker" data-id="' + h.id + '" aria-label="Change icon for ' + esc(h.name) + '">' + esc(h.icon) + '</button>' +
          '<input type="text" value="' + esc(h.name) + '" maxlength="40" data-act="rename" data-id="' + h.id + '" aria-label="Habit name">' +
          '<button class="del" data-act="delete" data-id="' + h.id + '" aria-label="Delete ' + esc(h.name) + '">' + BIN + '</button>' +
        '</div>' +
        (openPicker === h.id
          ? '<div class="emopick">' + EMOJI.map(function(e){
              return '<button data-act="seticon" data-id="' + h.id + '" data-icon="' + esc(e) + '"' +
                     ' aria-pressed="' + (e === h.icon) + '">' + e + '</button>';
            }).join('') + '</div>'
          : '') +
        '<div class="swatches">' +
          PALETTE.map(function(c){
            return '<button class="sw" data-act="setcolor" data-id="' + h.id + '" data-color="' + c + '"' +
                   ' aria-pressed="' + (c === h.color) + '" aria-label="Colour ' + c + '"><i style="background:' + c + '"></i></button>';
          }).join('') +
        '</div>' +
        '<div class="meta-line">Started ' + esc(fmt(h.start, {day:'numeric', month:'short', year:'numeric'})) +
          ' · ' + s.kept + '/' + s.total + ' days kept</div>' +
      '</div>'
    );
  });

  if (state.habits.length < MAX) {
    out.push(
      '<div class="addbox">' +
        '<div class="line">' +
          '<input type="text" id="newName" placeholder="New habit" maxlength="40" enterkeyhint="done">' +
          '<button class="btn" data-act="add">Add</button>' +
        '</div>' +
      '</div>' +
      '<p class="hint">' + (MAX - state.habits.length) + ' of ' + MAX + ' slots free</p>'
    );
  } else {
    out.push('<p class="hint">Five habits is the maximum — that is the point. Delete one to swap it out.</p>');
  }

  out.push(
    '<div class="sect">' +
      '<div class="head"><h3>Your data</h3></div>' +
      '<p class="note" style="margin:0 0 12px">Everything lives in this browser only. Nothing is uploaded. Clearing site data wipes it, so export a backup now and then.</p>' +
      '<div class="btnrow">' +
        '<button class="btn ghost" data-act="export">Export backup</button>' +
        '<button class="btn ghost" data-act="import">Import backup</button>' +
      '</div>' +
      '<div class="btnrow" style="margin-top:8px">' +
        '<button class="btn ghost" data-act="reset">Erase everything</button>' +
      '</div>' +
      '<input type="file" id="fileIn" accept="application/json,.json" hidden>' +
    '</div>'
  );

  document.getElementById('v-habits').innerHTML = '<div class="stack">' + out.join('') + '</div>';
}

function render(){
  var t = todayISO();
  document.getElementById('vTitle').textContent =
    view === 'today' ? 'Today' : view === 'insights' ? 'Insights' : 'Habits';
  document.getElementById('vSub').textContent =
    view === 'today'   ? fmt(t, {weekday:'long', day:'numeric', month:'long'}) :
    view === 'insights'? (state.habits.length ? 'Streaks, rates and calendars' : 'Nothing to show yet') :
                         'Up to ' + MAX + ' habits, edited here';

  document.getElementById('v-today').hidden    = view !== 'today';
  document.getElementById('v-insights').hidden = view !== 'insights';
  document.getElementById('v-habits').hidden   = view !== 'habits';

  if (view === 'today')    renderToday();
  if (view === 'insights') renderInsights();
  if (view === 'habits')   renderHabits();
}

function setView(v){
  if (view === v) { window.scrollTo({ top:0, behavior:'smooth' }); return; }
  view = v;
  openPicker = null;
  Array.prototype.forEach.call(document.querySelectorAll('nav button'), function(b){
    b.setAttribute('aria-selected', String(b.dataset.view === v));
  });
  render();
  window.scrollTo(0, 0);
}

/* ------------------------------------------------------------------ *
 * Data import / export
 * ------------------------------------------------------------------ */
function exportData(){
  var blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'habits-' + todayISO() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  toast('Backup downloaded');
}

function importData(file){
  var r = new FileReader();
  r.onload = function(){
    try {
      var d = JSON.parse(String(r.result));
      if (!d || !Array.isArray(d.habits)) throw new Error('bad shape');
      if (!confirm('Replace your current habits with ' + d.habits.length + ' from this backup?')) return;
      state = { v:1, habits: d.habits.slice(0, MAX).map(normalise) };
      save(); render();
      toast('Backup restored');
    } catch (e) {
      toast('That file is not a habits backup');
    }
  };
  r.onerror = function(){ toast('Could not read that file'); };
  r.readAsText(file);
}

/* ------------------------------------------------------------------ *
 * Theme
 * ------------------------------------------------------------------ */
var SUN  = '<circle cx="12" cy="12" r="4.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/>';
var MOON = '<path d="M20 14.5A8.2 8.2 0 019.6 4 8.5 8.5 0 1020 14.5z"/>';
var AUTO = '<circle cx="12" cy="12" r="8.4"/><path d="M12 3.6v16.8" /><path d="M12 3.6a8.4 8.4 0 010 16.8" fill="currentColor" stroke="none"/>';

function applyTheme(){
  var th = localStorage.getItem(THKEY) || 'auto';
  document.documentElement.setAttribute('data-theme', th);
  document.getElementById('themeIcon').innerHTML = th === 'light' ? SUN : th === 'dark' ? MOON : AUTO;
  document.getElementById('themeBtn').setAttribute(
    'aria-label', 'Theme: ' + th + ' — tap to change');
}
function cycleTheme(){
  var order = ['auto','light','dark'];
  var cur = localStorage.getItem(THKEY) || 'auto';
  var next = order[(order.indexOf(cur) + 1) % order.length];
  localStorage.setItem(THKEY, next);
  applyTheme();
  toast('Theme: ' + next);
}

/* ------------------------------------------------------------------ *
 * Events
 * ------------------------------------------------------------------ */
document.addEventListener('click', function(ev){
  var tab = ev.target.closest('nav button');
  if (tab) { setView(tab.dataset.view); return; }

  if (ev.target.closest('#themeBtn')) { cycleTheme(); return; }

  var el = ev.target.closest('[data-act]');
  if (!el) return;
  var act = el.dataset.act;

  if (act === 'toggle')     { toggleDay(el.dataset.id, el.dataset.date); }
  else if (act === 'quickadd') {
    if (addHabit(el.dataset.name, el.dataset.icon)) { render(); toast('Added ' + el.dataset.name); }
  }
  else if (act === 'dismisstip') { localStorage.setItem(TIPKEY, '1'); render(); }
  else if (act === 'delete')  { removeHabit(el.dataset.id); }
  else if (act === 'picker')  { openPicker = openPicker === el.dataset.id ? null : el.dataset.id; render(); }
  else if (act === 'seticon') {
    var hi = habitById(el.dataset.id);
    if (hi) { hi.icon = el.dataset.icon; save(); openPicker = null; render(); }
  }
  else if (act === 'setcolor') {
    var hc = habitById(el.dataset.id);
    if (hc) { hc.color = el.dataset.color; save(); render(); }
  }
  else if (act === 'add') {
    var inp = document.getElementById('newName');
    if (!inp.value.trim()) { inp.focus(); return; }
    var nm = inp.value.trim();
    if (addHabit(nm)) { render(); toast('Added ' + nm); }
  }
  else if (act === 'export') { exportData(); }
  else if (act === 'import') { document.getElementById('fileIn').click(); }
  else if (act === 'reset') {
    if (confirm('Erase all habits and history? This cannot be undone.')) {
      state = { v:1, habits:[] };
      save(); render(); toast('Everything erased');
    }
  }
});

document.addEventListener('input', function(ev){
  var el = ev.target;
  if (el.dataset && el.dataset.act === 'rename') {
    var h = habitById(el.dataset.id);
    if (h) { h.name = el.value.slice(0, 40); save(); }
  }
});

document.addEventListener('change', function(ev){
  if (ev.target.id === 'fileIn' && ev.target.files && ev.target.files[0]) {
    importData(ev.target.files[0]);
    ev.target.value = '';
  }
});

document.addEventListener('keydown', function(ev){
  if (ev.key === 'Enter' && ev.target.id === 'newName') {
    ev.preventDefault();
    var nm = ev.target.value.trim();
    if (addHabit(nm)) { render(); toast('Added ' + nm); }
  }
  if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.act === 'rename') ev.target.blur();
});

/* header hairline on scroll */
addEventListener('scroll', function(){
  document.getElementById('hdr').classList.toggle('scrolled', window.scrollY > 4);
}, { passive:true });

/* roll over at midnight, and whenever the app comes back to the foreground */
var lastDay = todayISO();
function checkDay(){
  var t = todayISO();
  if (t !== lastDay) { lastDay = t; render(); }
}
setInterval(checkDay, 30000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) checkDay(); });

/* ------------------------------------------------------------------ *
 * Go
 * ------------------------------------------------------------------ */
applyTheme();
render();

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* offline is a bonus, not a requirement */ });
  });
}
})();
</script>
</body>
</html>
